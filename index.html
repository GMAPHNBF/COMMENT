<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>අදහස් හා පිළිතුරු</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Firebase SDKs (Compat - CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding-right: 120px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .header h1 i {
            color: #6c63ff;
            margin-right: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        /* ===== HOME BUTTON ===== */
        .btn-home-header {
            position: absolute;
            top: 0;
            right: 0;
            background: linear-gradient(135deg, #004a99, #00f2ff);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 74, 153, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        .btn-home-header:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 255, 0.6);
            background: linear-gradient(135deg, #00f2ff, #004a99);
        }

        /* ===== AUTH SECTION ===== */
        .auth-section {
            background: #f0f2fe;
            padding: 20px 24px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid #d5d4f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .auth-section .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-section .user-info .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a29bfe);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .auth-section .user-info .user-email {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .auth-section .auth-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-outline {
            padding: 10px 24px;
            border: 2px solid #6c63ff;
            border-radius: 12px;
            background: transparent;
            color: #6c63ff;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline:hover {
            background: #6c63ff;
            color: white;
        }

        .btn-outline-danger {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .btn-outline-danger:hover {
            background: #ff6b6b;
            color: white;
        }

        .btn-primary {
            padding: 10px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c63ff, #5a52d5);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(108, 99, 255, 0.45);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            background: #e55a5a;
            transform: scale(0.95);
        }

        .btn-reply {
            background: transparent;
            color: #6c63ff;
            font-size: 12px;
            padding: 4px 14px;
            border: 1px solid #6c63ff;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reply:hover {
            background: #6c63ff;
            color: white;
        }

        .btn-cancel-reply {
            background: transparent;
            color: #999;
            font-size: 12px;
            padding: 4px 12px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-cancel-reply:hover {
            color: #ff6b6b;
        }

        .btn-submit-reply {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00b894, #00a381);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit-reply:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.35);
        }

        .btn-submit-reply:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== AUTH MODAL ===== */
        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .auth-modal.active {
            display: flex;
        }

        .auth-modal .modal-content {
            background: white;
            padding: 40px;
            border-radius: 24px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.3s ease;
        }

        .auth-modal .modal-content h2 {
            text-align: center;
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .auth-modal .modal-content .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-modal .modal-content input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ebf5;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
            margin-bottom: 14px;
        }

        .auth-modal .modal-content input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }

        .auth-modal .modal-content .auth-error {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        .auth-modal .modal-content .auth-error.show {
            display: block;
        }

        .auth-modal .modal-content .modal-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .auth-modal .modal-content .modal-actions .btn-primary {
            flex: 1;
            justify-content: center;
        }

        .auth-modal .modal-content .modal-actions .btn-outline {
            flex: 1;
            justify-content: center;
        }

        .auth-modal .modal-content .toggle-mode {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #999;
        }

        .auth-modal .modal-content .toggle-mode span {
            color: #6c63ff;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-modal .modal-content .toggle-mode span:hover {
            text-decoration: underline;
        }

        /* ===== COMMENT FORM ===== */
        .comment-form {
            background: #f8f9ff;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid #e8ebf5;
        }

        .comment-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .comment-form input,
        .comment-form textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ebf5;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
            outline: none;
        }

        .comment-form input:focus,
        .comment-form textarea:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }

        .comment-form textarea {
            grid-column: 1 / -1;
            resize: vertical;
            min-height: 80px;
        }

        .comment-form .form-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* ===== COMMENTS ===== */
        .comments-container {
            margin-top: 10px;
        }

        .comment-item {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 16px;
            border: 1px solid #e8ebf5;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease;
        }

        .comment-item:hover {
            border-color: #d0cef0;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.06);
        }

        .comment-item .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .comment-item .comment-author {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comment-item .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a29bfe);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .comment-item .name {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 15px;
        }

        .comment-item .timestamp {
            font-size: 12px;
            color: #aaa;
            font-weight: 400;
        }

        .comment-item .comment-text {
            color: #333;
            font-size: 14px;
            line-height: 1.7;
            margin-left: 48px;
            word-wrap: break-word;
        }

        .comment-item .comment-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 10px;
            margin-left: 48px;
            flex-wrap: wrap;
        }

        .comment-item .comment-actions .reply-count {
            font-size: 12px;
            color: #999;
        }

        /* ===== REPLIES ===== */
        .replies-container {
            margin-left: 55px;
            margin-top: 12px;
            padding-left: 20px;
            border-left: 3px solid #e8ebf5;
        }

        .reply-item {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border: 1px solid #eef0f7;
        }

        .reply-item .reply-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .reply-item .reply-author {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reply-item .reply-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fd79a8, #e17055);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
        }

        .reply-item .reply-name {
            font-weight: 500;
            color: #1a1a2e;
            font-size: 13px;
        }

        .reply-item .reply-text {
            font-size: 13px;
            color: #444;
            margin-left: 38px;
            line-height: 1.6;
        }

        .reply-item .reply-timestamp {
            font-size: 11px;
            color: #bbb;
        }

        .reply-item .delete-reply-btn {
            background: transparent;
            border: none;
            color: #ff6b6b;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .reply-item .delete-reply-btn:hover {
            background: #ffe0e0;
        }

        /* ===== REPLY FORM ===== */
        .reply-form {
            display: none;
            margin-top: 12px;
            margin-left: 48px;
            background: #f0f2fe;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #d5d4f0;
        }

        .reply-form.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .reply-form .reply-form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .reply-form input {
            padding: 10px 14px;
            border: 2px solid #e8ebf5;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
            background: white;
        }

        .reply-form input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
        }

        .reply-form .reply-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* ===== LOADING / EMPTY ===== */
        .loading {
            text-align: center;
            color: #999;
            padding: 30px 0;
            font-size: 14px;
        }

        .loading i {
            font-size: 24px;
            display: block;
            margin-bottom: 10px;
            color: #6c63ff;
        }

        .empty-state {
            text-align: center;
            color: #bbb;
            padding: 40px 0;
        }

        .empty-state i {
            font-size: 48px;
            color: #e0e0f0;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .header {
                padding-right: 0;
            }
            .comment-form .form-row {
                grid-template-columns: 1fr;
            }
            .comment-item .comment-text {
                margin-left: 0;
            }
            .comment-item .comment-actions {
                margin-left: 0;
            }
            .replies-container {
                margin-left: 0;
                padding-left: 12px;
            }
            .reply-form {
                margin-left: 0;
            }
            .auth-section {
                flex-direction: column;
                text-align: center;
            }
            .auth-modal .modal-content {
                padding: 24px;
            }
            .btn-home-header {
                position: static;
                display: inline-flex;
                margin-top: 10px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1><i class="fas fa-comment-dots"></i> අදහස් හා පිළිතුරු</h1>
            <p>ඔබගේ අදහස් බෙදාගන්න, අන් අයට පිළිතුරු දෙන්න</p>
            
            <!-- HOME BUTTON -->
            <a href="https://gmaphnbf.github.io/HNBFGMAP/" target="_blank" class="btn-home-header">
                <i class="fas fa-home"></i> Home
            </a>
        </div>

        <!-- AUTH SECTION -->
        <div class="auth-section" id="authSection">
            <div class="user-info" id="userInfo" style="display:none;">
                <div class="user-avatar" id="userAvatar">U</div>
                <span class="user-email" id="userEmail">user@email.com</span>
            </div>
            <div class="auth-buttons" id="authButtons">
                <button class="btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt"></i> පිවිසෙන්න</button>
                <button class="btn-outline" id="signupBtn"><i class="fas fa-user-plus"></i> ලියාපදිංචි වන්න</button>
            </div>
            <div class="auth-buttons" id="logoutButton" style="display:none;">
                <button class="btn-outline btn-outline-danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> පිටවන්න</button>
            </div>
        </div>

        <!-- COMMENT FORM -->
        <div class="comment-form" id="commentFormSection" style="display:none;">
            <form id="commentForm">
                <div class="form-row">
                    <input type="text" id="nameInput" placeholder="👤 ඔබගේ නම" required />
                    <textarea id="commentInput" placeholder="💬 ඔබගේ අදහස ලියන්න..." required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="submitBtn">
                        <i class="fas fa-paper-plane"></i> අදහස පළ කරන්න
                    </button>
                </div>
            </form>
        </div>

        <!-- COMMENTS CONTAINER -->
        <div id="commentsContainer" class="comments-container">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> අදහස් පූරණය වෙමින්...</div>
        </div>
    </div>

    <!-- ===== AUTH MODAL ===== -->
    <div class="auth-modal" id="authModal">
        <div class="modal-content">
            <h2 id="modalTitle">පිවිසෙන්න</h2>
            <p class="subtitle" id="modalSubtitle">ඔබගේ ගිණුමට පිවිසෙන්න</p>
            <div class="auth-error" id="authError">වලංගු නොවන ඊමේල් හෝ මුරපදයක්</div>
            <input type="email" id="authEmail" placeholder="📧 ඊමේල් ලිපිනය" required />
            <input type="password" id="authPassword" placeholder="🔒 මුරපදය" required />
            <div class="modal-actions">
                <button class="btn-primary" id="authSubmitBtn"><i class="fas fa-sign-in-alt"></i> පිවිසෙන්න</button>
                <button class="btn-outline" id="authCancelBtn"><i class="fas fa-times"></i> අවලංගු කරන්න</button>
            </div>
            <div class="toggle-mode">
                <span id="toggleAuthMode">ලියාපදිංචි වන්න</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBUx6D6ekamqm-1XdK1q8n1D_UfvLrMU8s",
            authDomain: "commentn-f7a7e.firebaseapp.com",
            databaseURL: "https://commentn-f7a7e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "commentn-f7a7e",
            storageBucket: "commentn-f7a7e.firebasestorage.app",
            messagingSenderId: "295619897354",
            appId: "1:295619897354:web:bb6b7669b003f1447697f3",
            measurementId: "G-0P6JX7PMS0"
        };

        // Firebase Initialize
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        console.log("🔥 Firebase initialized!");

        // ============================================================
        // 🎯 AUTH STATE MANAGEMENT
        // ============================================================

        let currentUser = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                console.log("✅ User signed in:", user.email);
                showLoggedInUI(user);
                loadComments();
            } else {
                currentUser = null;
                console.log("❌ User signed out");
                showLoggedOutUI();
                loadComments();
            }
        });

        // ============================================================
        // 🎯 UI UPDATE FUNCTIONS
        // ============================================================

        function showLoggedInUI(user) {
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userEmail').textContent = user.email || 'No Email';
            document.getElementById('userAvatar').textContent = (user.email ? user.email.charAt(0).toUpperCase() : 'U');
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('logoutButton').style.display = 'flex';
            document.getElementById('commentFormSection').style.display = 'block';
        }

        function showLoggedOutUI() {
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('authButtons').style.display = 'flex';
            document.getElementById('logoutButton').style.display = 'none';
            document.getElementById('commentFormSection').style.display = 'none';
        }

        // ============================================================
        // 🎯 AUTH MODAL
        // ============================================================

        let isLoginMode = true;

        function openAuthModal(mode) {
            isLoginMode = (mode === 'login');
            const modal = document.getElementById('authModal');
            const title = document.getElementById('modalTitle');
            const subtitle = document.getElementById('modalSubtitle');
            const submitBtn = document.getElementById('authSubmitBtn');
            const toggleText = document.getElementById('toggleAuthMode');
            const errorDiv = document.getElementById('authError');

            errorDiv.classList.remove('show');

            if (isLoginMode) {
                title.textContent = 'පිවිසෙන්න';
                subtitle.textContent = 'ඔබගේ ගිණුමට පිවිසෙන්න';
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> පිවිසෙන්න';
                toggleText.textContent = 'ලියාපදිංචි වන්න';
            } else {
                title.textContent = 'ලියාපදිංචි වන්න';
                subtitle.textContent = 'නව ගිණුමක් සාදන්න';
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> ලියාපදිංචි වන්න';
                toggleText.textContent = 'පිවිසෙන්න';
            }

            document.getElementById('authEmail').value = '';
            document.getElementById('authPassword').value = '';
            modal.classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
            document.getElementById('authError').classList.remove('show');
        }

        document.getElementById('loginBtn').addEventListener('click', () => openAuthModal('login'));
        document.getElementById('signupBtn').addEventListener('click', () => openAuthModal('signup'));
        document.getElementById('authCancelBtn').addEventListener('click', closeAuthModal);

        document.getElementById('toggleAuthMode').addEventListener('click', () => {
            openAuthModal(isLoginMode ? 'signup' : 'login');
        });

        document.getElementById('authModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('authModal')) {
                closeAuthModal();
            }
        });

        // ============================================================
        // 🎯 AUTH SUBMIT
        // ============================================================

        document.getElementById('authSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errorDiv = document.getElementById('authError');
            const submitBtn = document.getElementById('authSubmitBtn');

            if (!email || !password) {
                errorDiv.textContent = '❌ කරුණාකර ඊමේල් සහ මුරපදය ඇතුළත් කරන්න.';
                errorDiv.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> සකසමින්...';
            errorDiv.classList.remove('show');

            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    await auth.createUserWithEmailAndPassword(email, password);
                }
                closeAuthModal();
            } catch (error) {
                console.error('Auth error:', error);
                let message = '❌ දෝෂයක් ඇතිවිය.';
                if (error.code === 'auth/user-not-found') {
                    message = '❌ මෙම ඊමේල් එක සමඟ ගිණුමක් නොමැත.';
                } else if (error.code === 'auth/wrong-password') {
                    message = '❌ වැරදි මුරපදයකි.';
                } else if (error.code === 'auth/email-already-in-use') {
                    message = '❌ මෙම ඊමේල් එක දැනටමත් භාවිතයේ පවතී.';
                } else if (error.code === 'auth/weak-password') {
                    message = '❌ මුරපදය අවම වශයෙන් අකුරු 6කින් සමන්විත විය යුතුය.';
                } else if (error.code === 'auth/invalid-email') {
                    message = '❌ වලංගු ඊමේල් ලිපිනයක් ඇතුළත් කරන්න.';
                }
                errorDiv.textContent = message;
                errorDiv.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = isLoginMode ? 
                    '<i class="fas fa-sign-in-alt"></i> පිවිසෙන්න' : 
                    '<i class="fas fa-user-plus"></i> ලියාපදිංචි වන්න';
            }
        });

        // ============================================================
        // 🎯 LOGOUT
        // ============================================================

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await auth.signOut();
            } catch (error) {
                console.error('Logout error:', error);
            }
        });

        // ============================================================
        // 🎯 COMMENT CRUD OPERATIONS
        // ============================================================

        // 📝 ADD COMMENT
        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentUser) {
                alert('කරුණාකර පළමුව පිවිසෙන්න.');
                return;
            }

            const nameInput = document.getElementById('nameInput');
            const commentInput = document.getElementById('commentInput');
            const submitBtn = document.getElementById('submitBtn');

            const name = nameInput.value.trim();
            const text = commentInput.value.trim();

            if (!name || !text) {
                alert('කරුණාකර නම සහ අදහස ඇතුළත් කරන්න.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> පළ කරමින්...';

            try {
                const newComment = {
                    name: name,
                    text: text,
                    timestamp: Date.now(),
                    uid: currentUser.uid,
                    email: currentUser.email || 'anonymous'
                };
                await db.ref('comments').push(newComment);
                nameInput.value = '';
                commentInput.value = '';
                console.log('✅ Comment added successfully!');
            } catch (error) {
                console.error('Error adding comment:', error);
                alert('❌ අදහස පළ කිරීමට අසමත් විය. කරුණාකර නැවත උත්සාහ කරන්න.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> අදහස පළ කරන්න';
            }
        });

        // 📖 LOAD COMMENTS
        function loadComments() {
            const commentsRef = db.ref('comments');
            
            commentsRef.on('value', (snapshot) => {
                const container = document.getElementById('commentsContainer');
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-comment-slash"></i>
                            <p>තවම අදහස් නොමැත. පළමු අදහස එකතු කරන්න!</p>
                        </div>
                    `;
                    return;
                }

                // Convert object to array and sort by timestamp (newest first)
                const comments = Object.entries(data).map(([id, comment]) => ({
                    id,
                    ...comment
                })).sort((a, b) => b.timestamp - a.timestamp);

                let html = '';
                comments.forEach(comment => {
                    html += renderComment(comment);
                });

                container.innerHTML = html;
            });
        }

        // 🎨 RENDER COMMENT
        function renderComment(comment) {
            const timestamp = comment.timestamp ? new Date(comment.timestamp).toLocaleString() : 'මෑතකදී';
            const avatarLetter = comment.name ? comment.name.charAt(0).toUpperCase() : 'U';
            const isOwner = currentUser && comment.uid === currentUser.uid;
            
            let repliesHtml = '';
            if (comment.replies) {
                const replies = Object.entries(comment.replies).map(([id, reply]) => ({
                    id,
                    ...reply
                })).sort((a, b) => a.timestamp - b.timestamp);
                
                replies.forEach(reply => {
                    repliesHtml += renderReply(reply, comment.id);
                });
            }

            return `
                <div class="comment-item" data-comment-id="${comment.id}">
                    <div class="comment-header">
                        <div class="comment-author">
                            <div class="avatar">${avatarLetter}</div>
                            <span class="name">${escapeHtml(comment.name)}</span>
                            <span class="timestamp">${timestamp}</span>
                        </div>
                        ${isOwner ? `<button class="btn-danger" onclick="deleteComment('${comment.id}')"><i class="fas fa-trash"></i> මකන්න</button>` : ''}
                    </div>
                    <div class="comment-text">${escapeHtml(comment.text)}</div>
                    <div class="comment-actions">
                        <button class="btn-reply" onclick="toggleReplyForm('${comment.id}')">
                            <i class="fas fa-reply"></i> පිළිතුරු දෙන්න
                        </button>
                        ${comment.replies ? `<span class="reply-count"><i class="fas fa-comments"></i> ${Object.keys(comment.replies).length}</span>` : ''}
                    </div>
                    
                    <!-- Reply Form -->
                    <div class="reply-form" id="replyForm_${comment.id}">
                        <form onsubmit="submitReply(event, '${comment.id}')">
                            <div class="reply-form-row">
                                <input type="text" id="replyInput_${comment.id}" placeholder="💬 ඔබගේ පිළිතුර ලියන්න..." required />
                                <div class="reply-actions">
                                    <button type="submit" class="btn-submit-reply"><i class="fas fa-paper-plane"></i> පිළිතුරු</button>
                                    <button type="button" class="btn-cancel-reply" onclick="toggleReplyForm('${comment.id}')">අවලංගු කරන්න</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Replies -->
                    ${repliesHtml ? `<div class="replies-container">${repliesHtml}</div>` : ''}
                </div>
            `;
        }

        // 🎨 RENDER REPLY
        function renderReply(reply, commentId) {
            const timestamp = reply.timestamp ? new Date(reply.timestamp).toLocaleString() : 'මෑතකදී';
            const avatarLetter = reply.name ? reply.name.charAt(0).toUpperCase() : 'U';
            const isOwner = currentUser && reply.uid === currentUser.uid;

            return `
                <div class="reply-item" data-reply-id="${reply.id}">
                    <div class="reply-header">
                        <div class="reply-author">
                            <div class="reply-avatar">${avatarLetter}</div>
                            <span class="reply-name">${escapeHtml(reply.name)}</span>
                            <span class="reply-timestamp">${timestamp}</span>
                        </div>
                        ${isOwner ? `<button class="delete-reply-btn" onclick="deleteReply('${commentId}', '${reply.id}')"><i class="fas fa-times"></i> මකන්න</button>` : ''}
                    </div>
                    <div class="reply-text">${escapeHtml(reply.text)}</div>
                </div>
            `;
        }

        // ============================================================
        // 🎯 REPLY OPERATIONS
        // ============================================================

        // Toggle Reply Form
        function toggleReplyForm(commentId) {
            const form = document.getElementById(`replyForm_${commentId}`);
            if (form) {
                form.classList.toggle('active');
                if (form.classList.contains('active')) {
                    const input = document.getElementById(`replyInput_${commentId}`);
                    if (input) input.focus();
                }
            }
        }

        // Submit Reply
        async function submitReply(event, commentId) {
            event.preventDefault();
            
            if (!currentUser) {
                alert('කරුණාකර පළමුව පිවිසෙන්න.');
                return;
            }

            const input = document.getElementById(`replyInput_${commentId}`);
            const text = input.value.trim();

            if (!text) {
                alert('කරුණාකර පිළිතුර ඇතුළත් කරන්න.');
                return;
            }

            const submitBtn = event.target.querySelector('.btn-submit-reply');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const reply = {
                    name: currentUser.email ? currentUser.email.split('@')[0] : 'Anonymous',
                    text: text,
                    timestamp: Date.now(),
                    uid: currentUser.uid
                };
                
                await db.ref(`comments/${commentId}/replies`).push(reply);
                input.value = '';
                toggleReplyForm(commentId);
                console.log('✅ Reply added successfully!');
            } catch (error) {
                console.error('Error adding reply:', error);
                alert('❌ පිළිතුර එකතු කිරීමට අසමත් විය.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> පිළිතුරු';
            }
        }

        // ============================================================
        // 🎯 DELETE OPERATIONS
        // ============================================================

        // Delete Comment
        async function deleteComment(commentId) {
            if (!confirm('මෙම අදහස මකා දැමීමට ඔබට අවශ්‍යද?')) return;
            
            try {
                await db.ref(`comments/${commentId}`).remove();
                console.log('✅ Comment deleted successfully!');
            } catch (error) {
                console.error('Error deleting comment:', error);
                alert('❌ අදහස මකා දැමීමට අසමත් විය.');
            }
        }

        // Delete Reply
        async function deleteReply(commentId, replyId) {
            if (!confirm('මෙම පිළිතුර මකා දැමීමට ඔබට අවශ්‍යද?')) return;
            
            try {
                await db.ref(`comments/${commentId}/replies/${replyId}`).remove();
                console.log('✅ Reply deleted successfully!');
            } catch (error) {
                console.error('Error deleting reply:', error);
                alert('❌ පිළිතුර මකා දැමීමට අසමත් විය.');
            }
        }

        // ============================================================
        // 🎯 UTILITY FUNCTIONS
        // ============================================================

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Make functions globally accessible
        window.toggleReplyForm = toggleReplyForm;
        window.submitReply = submitReply;
        window.deleteComment = deleteComment;
        window.deleteReply = deleteReply;

        console.log('✅ All functions loaded successfully!');
    </script>
</body>
</html>
